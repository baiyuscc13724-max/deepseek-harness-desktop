ShortDescription: 在 Windows 上本地运行开源 DeepSeek Harness 工作台的独立社区桌面客户端。
Description: Harness Desktop 在本机启动 DeepSeek Harness 运行时，并通过 Windows 桌面外壳显示其官方 Web 工作台。它包含项目与会话流程、模型路由、工具、子代理、主题、系统托盘和可选桌面宠物。本项目是独立社区项目，并非 DeepSeek 官方产品。
