ReleaseNotes: 更新安装会沿用原安装目录，不再自动返回 C 盘；安装时不再尝试关闭无关安全软件。同时包含空白区域窗口拖动、子代理详情、清晰的缓存指标和稳定的模型路由兼容修复。
