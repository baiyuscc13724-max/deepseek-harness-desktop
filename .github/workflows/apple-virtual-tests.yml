name: Apple Virtual Device Tests
run-name: Apple mobile @ ${{ inputs.source_revision || github.sha }} · ${{ inputs.request_id || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact committed source revision to validate
        required: false
        type: string
      request_id:
        description: Stable publisher request identity
        required: false
        default: manual
        type: string
      mobile_only:
        description: Validate only iPhone/iPad simulators and skip desktop packaging
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: apple-virtual-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulators:
    name: iPhone and iPad simulators
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          ref: ${{ inputs.source_revision || github.sha }}
      - name: Bind exact mobile source revision
        if: inputs.source_revision != ''
        shell: bash
        run: test "$(git rev-parse HEAD)" = '${{ inputs.source_revision }}'
      - name: Select Xcode 16
        shell: bash
        run: |
          xcode_path="$(find /Applications -maxdepth 1 -type d -name 'Xcode_16*.app' | sort -V | tail -1)"
          test -n "$xcode_path"
          sudo xcode-select -s "$xcode_path/Contents/Developer"
          xcodebuild -version
      - name: Install pinned XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen-2.46.0.zip"
          curl -fsSL --retry 5 'https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip' -o "$archive"
          echo '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  '"$archive" | shasum -a 256 -c -
          unzip -q "$archive" -d "$RUNNER_TEMP/xcodegen-dist"
          echo "$RUNNER_TEMP/xcodegen-dist/xcodegen/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/xcodegen-dist/xcodegen/bin/xcodegen" --version
      - name: Generate Xcode project
        working-directory: mobile/ios
        run: xcodegen generate
      - name: Select virtual Apple devices
        id: devices
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          flat = [device for runtime in devices.values() for device in runtime if device.get('isAvailable')]
          for key, prefix in [('iphone', 'iPhone'), ('ipad', 'iPad')]:
              match = next((device for device in flat if device['name'].startswith(prefix)), None)
              if not match:
                  raise SystemExit(f'No available {prefix} simulator')
              print(f"{key}_udid={match['udid']}")
              print(f"{key}_name={match['name']}")
          PY
      - name: Boot iPhone and iPad simulators
        shell: bash
        run: |
          xcrun simctl boot "${{ steps.devices.outputs.iphone_udid }}" || true
          xcrun simctl bootstatus "${{ steps.devices.outputs.iphone_udid }}" -b
          xcrun simctl boot "${{ steps.devices.outputs.ipad_udid }}" || true
          xcrun simctl bootstatus "${{ steps.devices.outputs.ipad_udid }}" -b
      - name: Test on iPhone Simulator
        working-directory: mobile/ios
        run: >-
          xcodebuild test
          -project HarnessMobile.xcodeproj
          -scheme HarnessMobile
          -destination 'id=${{ steps.devices.outputs.iphone_udid }}'
          CODE_SIGNING_ALLOWED=NO
      - name: Test on iPad Simulator
        working-directory: mobile/ios
        run: >-
          xcodebuild test
          -project HarnessMobile.xcodeproj
          -scheme HarnessMobile
          -destination 'id=${{ steps.devices.outputs.ipad_udid }}'
          CODE_SIGNING_ALLOWED=NO

  macos-desktop:
    name: macOS Desktop package contracts
    if: ${{ inputs.mobile_only != true }}
    runs-on: macos-14
    timeout-minutes: 50
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          ref: ${{ inputs.source_revision || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install native macOS validation dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts --include=optional && node scripts/patch-official-runtime.mjs
      - name: Verify source and release contracts
        run: |
          npm run verify
          npm run verify:release
      - name: Install Intel macOS dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts --include=optional --os=darwin --cpu=x64 && node scripts/patch-official-runtime.mjs
      - name: Build unsigned Intel app bundle
        run: >-
          npx electron-builder --mac dir --x64 --publish never
          --config.npmRebuild=false
          --config.mac.identity=null
          --config.mac.notarize=false
          --config.directories.output=dist-apple-test
      - name: Inspect Intel architecture and native dependencies
        shell: bash
        run: |
          test -d 'dist-apple-test/mac/Harness Desktop.app'
          file 'dist-apple-test/mac/Harness Desktop.app/Contents/MacOS/Harness Desktop' | grep -q 'x86_64'
          test -f 'dist-apple-test/mac/Harness Desktop.app/Contents/Resources/app.asar'
          find 'dist-apple-test/mac/Harness Desktop.app/Contents/Resources/app.asar.unpacked/node_modules/@img' -name '*.node' | grep -q 'darwin-x64'
          find 'dist-apple-test/mac/Harness Desktop.app/Contents/Resources/app.asar.unpacked/node_modules/@koromix' -name '*.node' | grep -q 'darwin_x64'
          test -f 'dist-apple-test/mac/Harness Desktop.app/Contents/Resources/app.asar.unpacked/node_modules/node-pty/prebuilds/darwin-x64/pty.node'
          test -x 'dist-apple-test/mac/Harness Desktop.app/Contents/Resources/app.asar.unpacked/node_modules/node-pty/prebuilds/darwin-x64/spawn-helper'
      - name: Run packaged Intel macOS self-test
        shell: bash
        run: |
          output="$RUNNER_TEMP/harness-desktop-macos-selftest.json"
          profile="$RUNNER_TEMP/harness-desktop-macos-profile"
          set +e
          'dist-apple-test/mac/Harness Desktop.app/Contents/MacOS/Harness Desktop' \
            "--user-data-dir=$profile" "--harness-user-data-dir=$profile" \
            --self-test "--self-test-output=$output"
          app_exit=$?
          set -e
          if test -f "$output"; then cat "$output"; else echo 'Packaged macOS self-test did not create a report.'; fi
          test "$app_exit" -eq 0
          node -e "const r=require(process.argv[1]); if(!r.ok) process.exit(1)" "$output"
      - name: Install Apple Silicon dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts --include=optional --os=darwin --cpu=arm64 && node scripts/patch-official-runtime.mjs
      - name: Build unsigned Apple Silicon app bundle
        run: >-
          npx electron-builder --mac dir --arm64 --publish never
          --config.npmRebuild=false
          --config.mac.identity=null
          --config.mac.notarize=false
          --config.directories.output=dist-apple-test
      - name: Inspect Apple Silicon architecture and native dependencies
        shell: bash
        run: |
          test -d 'dist-apple-test/mac-arm64/Harness Desktop.app'
          file 'dist-apple-test/mac-arm64/Harness Desktop.app/Contents/MacOS/Harness Desktop' | grep -q 'arm64'
          test -f 'dist-apple-test/mac-arm64/Harness Desktop.app/Contents/Resources/app.asar'
          find 'dist-apple-test/mac-arm64/Harness Desktop.app/Contents/Resources/app.asar.unpacked/node_modules/@img' -name '*.node' | grep -q 'darwin-arm64'
          find 'dist-apple-test/mac-arm64/Harness Desktop.app/Contents/Resources/app.asar.unpacked/node_modules/@koromix' -name '*.node' | grep -q 'darwin_arm64'
          test -f 'dist-apple-test/mac-arm64/Harness Desktop.app/Contents/Resources/app.asar.unpacked/node_modules/node-pty/prebuilds/darwin-arm64/pty.node'
          test -x 'dist-apple-test/mac-arm64/Harness Desktop.app/Contents/Resources/app.asar.unpacked/node_modules/node-pty/prebuilds/darwin-arm64/spawn-helper'
      - name: Run packaged Apple Silicon macOS self-test
        shell: bash
        run: |
          output="$RUNNER_TEMP/harness-desktop-macos-arm64-selftest.json"
          profile="$RUNNER_TEMP/harness-desktop-macos-arm64-profile"
          set +e
          'dist-apple-test/mac-arm64/Harness Desktop.app/Contents/MacOS/Harness Desktop' \
            "--user-data-dir=$profile" "--harness-user-data-dir=$profile" \
            --self-test "--self-test-output=$output"
          app_exit=$?
          set -e
          if test -f "$output"; then cat "$output"; else echo 'Packaged Apple Silicon self-test did not create a report.'; fi
          test "$app_exit" -eq 0
          node -e "const r=require(process.argv[1]); if(!r.ok) process.exit(1)" "$output"
