name: Publish Verified Production Components

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable Bootstrap release tag
        required: true
        default: v1.0.31
      request_id:
        description: Unique publisher request identity
        required: false
  push:
    branches:
      - 'component-publish/v1.0.31'

run-name: Components ${{ inputs.tag || 'v1.0.31' }} · ${{ inputs.request_id || github.run_id }}

permissions:
  contents: read

concurrency:
  group: production-components-${{ inputs.tag || 'v1.0.31' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || 'v1.0.31' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install verification dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Bind component payload inputs to immutable tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git archive "$RELEASE_TAG" electron renderer plugins package.json build/icon.png | tar -xf -
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
      - name: Prepare signed staging from protected CI key
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          COMPONENT_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.HARNESS_COMPONENT_SIGNING_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$COMPONENT_SIGNING_PRIVATE_KEY_BASE64" || { echo 'HARNESS_COMPONENT_SIGNING_PRIVATE_KEY_BASE64 is not configured.' >&2; exit 1; }
          version="${RELEASE_TAG#v}"
          fallback_dir="$RUNNER_TEMP/component-fallbacks"
          output_dir="$RUNNER_TEMP/component-production"
          staging_dir="component-release-staging/$version"
          key_file="$RUNNER_TEMP/component-production-ed25519-private.pem"
          trap 'rm -f "$key_file"' EXIT
          umask 077
          printf '%s' "$COMPONENT_SIGNING_PRIVATE_KEY_BASE64" | base64 --decode > "$key_file"
          mkdir -p "$fallback_dir" "$staging_dir"
          for name in \
            "Harness-Desktop-$version-win-x64.exe" \
            "Harness-Desktop-$version-mac-x64.dmg" \
            "Harness-Desktop-$version-mac-arm64.dmg"; do
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$fallback_dir"
          done
          published_at="$(git show -s --format=%cI "$RELEASE_TAG^{}")"
          HARNESS_COMPONENT_SIGNING_KEY_FILE="$key_file" \
          HARNESS_COMPONENT_KEY_ID='harness-components-02643f81164c594a' \
            node scripts/prepare-production-components.mjs --version "$version" --published-at "$published_at" --release-dir "$fallback_dir" --out "$output_dir"
          cp "$output_dir"/assets/* "$staging_dir"/
          cp "$output_dir"/manifests/* "$staging_dir"/
          (cd "$staging_dir" && sha256sum components-*.json desktop-shell-*.zip > COMPONENT-SHA256SUMS.txt)
      - name: Verify target tag and signed staging set
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq 'select(.isDraft == false) | .isDraft' | grep -qx false
          node scripts/verify-production-component-staging.mjs --version="$version" --dir="component-release-staging/$version"
      - name: Preserve matching assets and identify missing component assets
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          staging="component-release-staging/$version"
          mapfile -t files < <(find "$staging" -maxdepth 1 -type f -print | LC_ALL=C sort)
          test "${#files[@]}" -eq 7
          : > "$RUNNER_TEMP/missing-components.txt"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets > "$RUNNER_TEMP/current-components.json"
          for file in "${files[@]}"; do
            name="$(basename "$file")"
            size="$(stat -c %s "$file")"
            digest="sha256:$(sha256sum "$file" | awk '{print $1}')"
            asset="$(jq -c --arg name "$name" '.assets[] | select(.name == $name)' "$RUNNER_TEMP/current-components.json")"
            if test -z "$asset"; then
              printf '%s\n' "$file" >> "$RUNNER_TEMP/missing-components.txt"
              continue
            fi
            jq -e --argjson size "$size" --arg digest "$digest" '.size == $size and .digest == $digest' <<<"$asset" >/dev/null || {
              echo "Existing immutable component differs from deterministic signed staging: $name" >&2
              exit 1
            }
            echo "Preserving verified existing component: $name"
          done
      - name: Upload only missing immutable signed component assets
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            test -n "$file" || continue
            name="$(basename "$file")"
            size="$(stat -c %s "$file")"
            digest="sha256:$(sha256sum "$file" | awk '{print $1}')"
            if ! gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "$file"; then
              raced="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq ".assets[] | select(.name == \"$name\")")"
              test -n "$raced"
              jq -e --argjson size "$size" --arg digest "$digest" '.size == $size and .digest == $digest' <<<"$raced" >/dev/null
              echo "A concurrent verified uploader won the immutable component race: $name"
            fi
          done < "$RUNNER_TEMP/missing-components.txt"
      - name: Re-download and verify public component assets
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir public-components
          while IFS= read -r name; do
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir public-components
          done < <(find "component-release-staging/$version" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          node scripts/verify-production-component-staging.mjs --version="$version" --dir=public-components
      - name: Sign exact desktop release manifest in protected CI
        shell: bash
        env:
          COMPONENT_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.HARNESS_COMPONENT_SIGNING_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$COMPONENT_SIGNING_PRIVATE_KEY_BASE64" || { echo 'HARNESS_COMPONENT_SIGNING_PRIVATE_KEY_BASE64 is not configured.' >&2; exit 1; }
          key_file="$RUNNER_TEMP/desktop-release-ed25519-private.pem"
          manifest_file="$RUNNER_TEMP/release-manifest.json"
          trap 'rm -f "$key_file" "$manifest_file"' EXIT
          umask 077
          printf '%s' "$COMPONENT_SIGNING_PRIVATE_KEY_BASE64" | base64 --decode > "$key_file"
          HARNESS_COMPONENT_SIGNING_KEY_FILE="$key_file" \
          HARNESS_COMPONENT_KEY_ID='harness-components-02643f81164c594a' \
            node scripts/refresh-release-manifest.mjs --version="${RELEASE_TAG#v}" --repo="$GITHUB_REPOSITORY" --output="$manifest_file"
          git fetch --force origin "refs/tags/$RELEASE_TAG"
          tag_revision="$(git rev-list -n 1 FETCH_HEAD)"
          git fetch --force origin "refs/heads/main:refs/remotes/origin/main"
          main_revision="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$tag_revision" "$main_revision"
          branch="release-manifest/$RELEASE_TAG"
          existing="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
          if test -n "$existing"; then
            git fetch --force origin "refs/heads/$branch:refs/remotes/origin/$branch"
            test "$(git rev-parse "refs/remotes/origin/$branch^")" = "$tag_revision"
            test "$(git diff-tree --no-commit-id --name-only -r "refs/remotes/origin/$branch")" = 'release-manifest.json'
            git show "refs/remotes/origin/$branch:release-manifest.json" > "$RUNNER_TEMP/existing-release-manifest.json"
            cmp "$manifest_file" "$RUNNER_TEMP/existing-release-manifest.json"
            rm -f "$RUNNER_TEMP/existing-release-manifest.json"
            echo "Preserving byte-identical signed release manifest branch: $branch"
            exit 0
          fi
          git checkout --detach "$tag_revision"
          cp "$manifest_file" release-manifest.json
          git add -- release-manifest.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "release: sign $RELEASE_TAG asset manifest" -- release-manifest.json
          test "$(git rev-parse HEAD^)" = "$tag_revision"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = 'release-manifest.json'
          git push origin "HEAD:refs/heads/$branch"
