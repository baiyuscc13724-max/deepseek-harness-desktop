name: Verify and Sign PR Preview Candidate

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build Same-Repository PR Preview run id
        required: true
      pull_request:
        description: Approved pull request number
        required: true
      head_sha:
        description: Approved exact 40-character PR head SHA
        required: true

run-name: Sign immutable candidate for PR #${{ inputs.pull_request }} · ${{ inputs.head_sha }}

permissions:
  actions: read
  contents: write

concurrency:
  group: pr-preview-sign-channel
  cancel-in-progress: false

jobs:
  verify-sign-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pr-preview-signing
    steps:
      - name: Prove dispatch originated from the repository default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_REF: ${{ github.ref }}
          TRUSTED_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$GITHUB_REPOSITORY" = 'baiyuscc13724-max/deepseek-harness-desktop'
          [[ "$TRUSTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
      - name: Checkout only the trusted workflow commit without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify trusted checkout
        shell: bash
        env:
          TRUSTED_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRUSTED_WORKFLOW_SHA"
      - name: Set up pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install trusted verification dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fetch and validate run and artifact metadata before download
        id: metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          APPROVED_PR: ${{ inputs.pull_request }}
          APPROVED_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$APPROVED_PR" =~ ^[1-9][0-9]*$ ]]
          [[ "$APPROVED_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          artifact_name="pr-preview-unsigned-$APPROVED_PR-$APPROVED_HEAD_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > "$RUNNER_TEMP/build-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/build-artifacts.json"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$APPROVED_PR" > "$RUNNER_TEMP/pull-request.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/official-stable-release.json"
          jq -e '.draft == false and .prerelease == false and (.published_at | type == "string") and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' \
            "$RUNNER_TEMP/official-stable-release.json" >/dev/null
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$APPROVED_HEAD_SHA" --argjson pr "$APPROVED_PR" '
            .number == $pr and .state == "open" and .draft == false and .merged_at == null and
            .head.sha == $sha and .head.repo.full_name == $repo and .head.repo.fork == false and
            .base.ref == "main" and .base.repo.full_name == $repo
          ' "$RUNNER_TEMP/pull-request.json" >/dev/null
          jq -e --arg name "$artifact_name" '
            [.artifacts[] | select(.name == $name and .expired == false)] | length == 1
          ' "$RUNNER_TEMP/build-artifacts.json" >/dev/null
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
      - name: Download the exact named artifact from the approved run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: ${{ runner.temp }}/unsigned-preview
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
      - name: Validate every byte and sign with the independent preview key
        shell: bash
        env:
          PREVIEW_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.HARNESS_PR_PREVIEW_SIGNING_PRIVATE_KEY_BASE64 }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          APPROVED_PR: ${{ inputs.pull_request }}
          APPROVED_HEAD_SHA: ${{ inputs.head_sha }}
          ARTIFACT_NAME: ${{ steps.metadata.outputs.artifact_name }}
        run: |
          set -euo pipefail
          test -n "$PREVIEW_SIGNING_PRIVATE_KEY_BASE64" || { echo 'Dedicated preview signing key is not configured.' >&2; exit 1; }
          key_file="$RUNNER_TEMP/pr-preview-ed25519-private.pem"
          trap 'rm -f "$key_file"' EXIT
          umask 077
          printf '%s' "$PREVIEW_SIGNING_PRIVATE_KEY_BASE64" | base64 --decode > "$key_file"
          published_at="$(jq -r '.updated_at' "$RUNNER_TEMP/build-run.json")"
          node scripts/pr-preview-sign.mjs \
            --run-metadata "$RUNNER_TEMP/build-run.json" \
            --pull-request-metadata "$RUNNER_TEMP/pull-request.json" \
            --stable-release-metadata "$RUNNER_TEMP/official-stable-release.json" \
            --trusted-preview-config "$GITHUB_WORKSPACE/pr-preview-update-sources.json" \
            --input "$RUNNER_TEMP/unsigned-preview" \
            --out "$RUNNER_TEMP/signed-preview" \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "$APPROVED_PR" \
            --head-sha "$APPROVED_HEAD_SHA" \
            --build-run-id "$BUILD_RUN_ID" \
            --artifact-name "$ARTIFACT_NAME" \
            --key-file "$key_file" \
            --key-id 'harness-preview-v1' \
            --cnb-project 'baiyuscc13724-max/deepseek-harness-desktop' \
            --published-at "$published_at"
      - name: Freeze only the immutable candidate bundle
        shell: bash
        run: |
          set -euo pipefail
          signed="$RUNNER_TEMP/signed-preview"
          audit="$signed/pr-preview-signing-audit.json"
          component="$(find "$signed" -maxdepth 1 -type f -name 'desktop-shell-*.zip' -printf '%f\n')"
          manifest="$(jq -r '.manifestReleaseAsset' "$audit")"
          index="$(jq -r '.indexReleaseAsset' "$audit")"
          expected="$RUNNER_TEMP/immutable-candidate-files.txt"
          actual="$RUNNER_TEMP/immutable-candidate-actual.txt"
          printf '%s\n' "$component" "$manifest" "$index" 'pr-preview-signing-audit.json' | LC_ALL=C sort > "$expected"
          find "$signed" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > "$actual"
          diff -u "$expected" "$actual"
          test "$(wc -l < "$actual")" -eq 4
          test -z "$(find "$signed" -mindepth 1 -type d -print -quit)"
      - name: Publish immutable GitHub fallback assets without replacement
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_PR: ${{ inputs.pull_request }}
          APPROVED_HEAD_SHA: ${{ inputs.head_sha }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          run_attempt="$(jq -r '.run_attempt // 1' "$RUNNER_TEMP/build-run.json")"
          tag="pr-preview-$APPROVED_PR-${APPROVED_HEAD_SHA:0:12}-run-$BUILD_RUN_ID-$run_attempt"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$APPROVED_HEAD_SHA" --prerelease \
              --title "PR #$APPROVED_PR preview ${APPROVED_HEAD_SHA:0:12}" \
              --notes "Immutable signed candidate only. Promotion requires separate protected local-gate evidence approval."
          fi
          resolved_tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)"
          test "$resolved_tag_sha" = "$APPROVED_HEAD_SHA"
          current="$RUNNER_TEMP/current-preview-assets.json"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets > "$current"
          while IFS= read -r file; do
            name="$(basename "$file")"
            size="$(stat -c %s "$file")"
            digest="sha256:$(sha256sum "$file" | awk '{print $1}')"
            existing="$(jq -c --arg name "$name" '.assets[] | select(.name == $name)' "$current")"
            if test -n "$existing"; then
              jq -e --argjson size "$size" --arg digest "$digest" '.size == $size and .digest == $digest' <<<"$existing" >/dev/null
              continue
            fi
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" "$file"
          done < <(find "$RUNNER_TEMP/signed-preview" -maxdepth 1 -type f -print | LC_ALL=C sort)
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets > "$current"
          jq -e --argjson count 4 '.assets | length == $count' "$current" >/dev/null
          while IFS= read -r file; do
            name="$(basename "$file")"
            size="$(stat -c %s "$file")"
            digest="sha256:$(sha256sum "$file" | awk '{print $1}')"
            jq -e --arg name "$name" --argjson size "$size" --arg digest "$digest" \
              '.assets[] | select(.name == $name and .size == $size and .digest == $digest)' "$current" >/dev/null
          done < <(find "$RUNNER_TEMP/signed-preview" -maxdepth 1 -type f -print | LC_ALL=C sort)
      - name: Preserve immutable candidate for local gate and protected promotion
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-preview-signed-candidate-${{ inputs.pull_request }}-${{ inputs.head_sha }}
          path: ${{ runner.temp }}/signed-preview/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
