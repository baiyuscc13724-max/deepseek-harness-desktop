name: Verify Component Signing Secret

on:
  workflow_dispatch:
  push:
    branches:
      - 'verify-component-signing-secret/v1.0.45'

permissions:
  contents: read

concurrency:
  group: verify-component-signing-secret
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Confirm protected secret is configured
        shell: bash
        env:
          COMPONENT_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.HARNESS_COMPONENT_SIGNING_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$COMPONENT_SIGNING_PRIVATE_KEY_BASE64" || { echo 'HARNESS_COMPONENT_SIGNING_PRIVATE_KEY_BASE64 is not configured.' >&2; exit 1; }
      - name: Verify protected secret against embedded trust root
        shell: bash
        env:
          COMPONENT_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.HARNESS_COMPONENT_SIGNING_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/component-production-ed25519-private.pem"
          trap 'rm -f "$key_file"' EXIT
          umask 077
          printf '%s' "$COMPONENT_SIGNING_PRIVATE_KEY_BASE64" | base64 --decode > "$key_file"
          node scripts/verify-component-signing-key.mjs \
            --key-file "$key_file" \
            --key-id harness-components-02643f81164c594a
