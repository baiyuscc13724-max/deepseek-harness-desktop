name: CI

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop, "release/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - run: npm run verify
      - name: Configure Electron sandbox
        run: |
          set -euo pipefail
          node node_modules/electron/install.js
          sandbox="$GITHUB_WORKSPACE/node_modules/electron/dist/chrome-sandbox"
          test -f "$sandbox"
          test ! -L "$sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          test "$(stat -c '%u:%g:%a' "$sandbox")" = '0:0:4755'
      - name: Verify browser navigation security in Electron
        env:
          HARNESS_BROWSER_TEST_REAL_INPUT: '1'
        run: xvfb-run -a npm run test:browser-electron
      - run: npm run verify:release
