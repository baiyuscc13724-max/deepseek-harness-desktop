name: CI

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop, "release/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - run: npm run verify
      - name: Run Agent Teams P1 release-blocking matrix
        env:
          HARNESS_AGENT_TEAMS_P1_RELEASE_GATES: '1'
        run: node --test tests/agent-teams-p1-release-gates.test.cjs
      - name: Configure Electron sandbox
        run: |
          set -euo pipefail
          node node_modules/electron/install.js
          sandbox="$GITHUB_WORKSPACE/node_modules/electron/dist/chrome-sandbox"
          test -f "$sandbox"
          test ! -L "$sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          test "$(stat -c '%u:%g:%a' "$sandbox")" = '0:0:4755'
      - name: Run Agent Teams installed-workbench artifact-fixture smoke
        env:
          HARNESS_AGENT_TEAMS_INSTALLED_SMOKE: '1'
        run: xvfb-run -a node --test tests/agent-teams-installed-workbench-smoke.test.cjs
      - name: Verify browser navigation security in Electron
        env:
          HARNESS_BROWSER_TEST_REAL_INPUT: '1'
        run: xvfb-run -a npm run test:browser-electron
      - run: npm run verify:release

  android-mobile:
    name: Android mobile compile/test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Create ephemeral CI-only Android signing key
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/harness-mobile-ci-only.jks"
          keytool -genkeypair -noprompt -keystore "$keystore" -storepass androidci -keypass androidci -alias harness-ci -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=Harness CI Only,OU=Testing,O=Harness,L=CI,ST=CI,C=US'
          echo "HARNESS_ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          echo 'HARNESS_ANDROID_KEY_ALIAS=harness-ci' >> "$GITHUB_ENV"
          echo 'HARNESS_ANDROID_STORE_PASSWORD=androidci' >> "$GITHUB_ENV"
          echo 'HARNESS_ANDROID_KEY_PASSWORD=androidci' >> "$GITHUB_ENV"
      - name: Compile and test Android mobile source
        working-directory: mobile/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          if ! ./gradlew --no-daemon clean test lintDebug assembleDebug assembleRelease; then
            find app/build -type f -name 'lint-results-*.txt' -print -exec cat {} \;
            exit 1
          fi
