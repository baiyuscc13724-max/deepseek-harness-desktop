name: Publish Signed Android Mobile

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing desktop release tag that receives the signed APK
        required: true
        default: v1.0.44
      request_id:
        description: Unique publisher request identity
        required: false

run-name: Android ${{ inputs.tag || github.ref_name }} · ${{ inputs.request_id || github.run_id }}

permissions:
  contents: write

concurrency:
  group: android-mobile-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  signed-apk:
    name: Build, verify and publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      HARNESS_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      HARNESS_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      HARNESS_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      EXPECTED_ANDROID_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          lfs: true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify release tag and signing inputs
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if(process.argv[1] !== 'v'+p.version) throw new Error('Requested tag must equal v'+p.version)" "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
          test -n '${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}'
          test -n "$HARNESS_ANDROID_KEY_ALIAS"
          test -n "$HARNESS_ANDROID_STORE_PASSWORD"
          test -n "$HARNESS_ANDROID_KEY_PASSWORD"
          test -n "$EXPECTED_ANDROID_CERT_SHA256"
          for attempt in $(seq 1 180); do
            if test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || true)" = false; then exit 0; fi
            echo "Waiting for verified desktop release $RELEASE_TAG ($attempt/180)..."
            sleep 30
          done
          echo "Desktop release $RELEASE_TAG was not published within 90 minutes." >&2
          exit 1
      - name: Restore private release keystore
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/harness-mobile-release.jks"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          chmod 600 "$keystore"
          echo "HARNESS_ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
      - name: Build signed Android APK
        working-directory: mobile/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean test assembleRelease
      - name: Verify package, version and signing identity
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          source='mobile/android/app/build/outputs/apk/release/app-release.apk'
          asset="Harness-Mobile-${version}-android-universal.apk"
          test -s "$source"
          cp "$source" "$asset"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          test -x "$apksigner"
          test -x "$aapt"
          "$apksigner" verify --verbose "$asset"
          cert_report="$("$apksigner" verify --print-certs "$asset" 2>&1)"
          actual="$(printf '%s\n' "$cert_report" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          configured="$(printf '%s' "$EXPECTED_ANDROID_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          pinned='092aea424b7e2edadd648967b7a9f909997fc028072532aea6cf459fcebf1c21'
          keytool -exportcert -keystore "$HARNESS_ANDROID_KEYSTORE_PATH" -alias "$HARNESS_ANDROID_KEY_ALIAS" -storepass:env HARNESS_ANDROID_STORE_PASSWORD -file restored-cert.der
          restored="$(sha256sum restored-cert.der | awk '{print $1}')"
          echo "APK certificate digest (Base64): $(printf '%s' "$actual" | base64 -w 0)"
          echo "JKS certificate digest (Base64): $(printf '%s' "$restored" | base64 -w 0)"
          echo "Certificate digest lengths: apk=${#actual}, jks=${#restored}, configured=${#configured}"
          test -n "$actual"
          test "$configured" = "$pinned"
          test "$restored" = "$pinned"
          test "$actual" = "$pinned"
          echo "Verified certificate SHA-256: $actual"
          badging="$($aapt dump badging "$asset" | head -n 1)"
          echo "$badging"
          expected_version_code="$(node -e "const [major,minor,patch]=require('./package.json').version.split('.').map(Number); process.stdout.write(String(major*10000+minor*100+patch))")"
          printf '%s\n' "$badging" | grep -F "name='io.harnessdesktop.mobile'"
          printf '%s\n' "$badging" | grep -F "versionCode='$expected_version_code'"
          printf '%s\n' "$badging" | grep -F "versionName='$version'"
          checksum="Harness-Mobile-${version}-android-universal.apk.sha256"
          sha256sum "$asset" > "$checksum"
          echo "ANDROID_ASSET=$asset" >> "$GITHUB_ENV"
          echo "ANDROID_CHECKSUM=$checksum" >> "$GITHUB_ENV"
      - name: Add immutable signed APK to the existing release
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          mkdir public-existing
          if grep -Fx "$ANDROID_ASSET" <<< "$existing" >/dev/null; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ANDROID_ASSET" --dir public-existing
            (cd public-existing && sha256sum "$ANDROID_ASSET" > "$ANDROID_CHECKSUM")
            cp "public-existing/$ANDROID_CHECKSUM" "$ANDROID_CHECKSUM"
            echo 'Preserving the existing immutable APK and deriving its missing checksum when necessary.'
          else
            if grep -Fx "$ANDROID_CHECKSUM" <<< "$existing" >/dev/null; then
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ANDROID_CHECKSUM" --dir public-existing
              cp "public-existing/$ANDROID_CHECKSUM" "$ANDROID_CHECKSUM"
              sha256sum -c "$ANDROID_CHECKSUM"
            fi
            if ! gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "$ANDROID_ASSET"; then
              raced="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq ".assets[] | select(.name == \"$ANDROID_ASSET\") | .name")"
              test "$raced" = "$ANDROID_ASSET"
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ANDROID_ASSET" --dir public-existing
              (cd public-existing && sha256sum "$ANDROID_ASSET" > "$ANDROID_CHECKSUM")
              cp "public-existing/$ANDROID_CHECKSUM" "$ANDROID_CHECKSUM"
            fi
          fi
          latest="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          if ! grep -Fx "$ANDROID_CHECKSUM" <<< "$latest" >/dev/null; then
            if ! gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "$ANDROID_CHECKSUM"; then
              raced="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq ".assets[] | select(.name == \"$ANDROID_CHECKSUM\") | .name")"
              test "$raced" = "$ANDROID_CHECKSUM"
            fi
          fi
      - name: Verify public signed APK bytes and identity
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
          public="$RUNNER_TEMP/public-android"
          mkdir -p "$public"
          curl -fsSL --retry 5 "$base/$ANDROID_ASSET" -o "$public/$ANDROID_ASSET"
          curl -fsSL --retry 5 "$base/$ANDROID_CHECKSUM" -o "$public/$ANDROID_CHECKSUM"
          (cd "$public" && sha256sum -c "$ANDROID_CHECKSUM")
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          test -x "$apksigner"
          test -x "$aapt"
          "$apksigner" verify --verbose "$public/$ANDROID_ASSET"
          cert_report="$("$apksigner" verify --print-certs "$public/$ANDROID_ASSET" 2>&1)"
          actual="$(printf '%s\n' "$cert_report" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test "$actual" = '092aea424b7e2edadd648967b7a9f909997fc028072532aea6cf459fcebf1c21'
          version="$(node -p "require('./package.json').version")"
          expected_version_code="$(node -e "const [major,minor,patch]=require('./package.json').version.split('.').map(Number); process.stdout.write(String(major*10000+minor*100+patch))")"
          badging="$($aapt dump badging "$public/$ANDROID_ASSET" | head -n 1)"
          printf '%s\n' "$badging" | grep -F "name='io.harnessdesktop.mobile'"
          printf '%s\n' "$badging" | grep -F "versionCode='$expected_version_code'"
          printf '%s\n' "$badging" | grep -F "versionName='$version'"
          assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          grep -Fx "$ANDROID_ASSET" <<< "$assets"
          grep -Fx "$ANDROID_CHECKSUM" <<< "$assets"
