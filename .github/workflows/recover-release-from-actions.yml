name: Recover Release From Verified Actions Artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable product tag
        required: true
        default: v1.0.40
      source_run_id:
        description: Failed release run whose platform build jobs all passed
        required: true
      release_id:
        description: Exact private draft created by the repository owner (empty or verified desktop subset)
        required: true
      publisher_revision:
        description: Optional exact main revision containing a post-tag publisher recovery fix
        required: false
      request_id:
        description: Unique publisher request identity
        required: false

run-name: Recover ${{ inputs.tag }} · ${{ inputs.request_id || github.run_id }}

permissions:
  actions: read
  contents: write

concurrency:
  # Share the main release lock so recovery cannot race its source workflow while
  # that workflow is still staging or verifying the same private draft.
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  recover:
    name: Transfer verified cloud artifacts and snapshot draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      RELEASE_ID: ${{ inputs.release_id }}
      PUBLISHER_REVISION: ${{ inputs.publisher_revision }}
      WORKFLOW_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
      - name: Verify immutable source run, successful jobs, and exact draft subset
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$PUBLISHER_REVISION" ]; then
            test "$WORKFLOW_REVISION" = "$PUBLISHER_REVISION" || { echo 'Post-tag recovery workflow revision mismatch.' >&2; exit 1; }
          fi
          version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$version" || { echo 'Release tag does not match package version.' >&2; exit 1; }
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          test "$(git rev-parse HEAD)" = "$tag_commit" || { echo 'Recovery checkout is not the immutable product tag.' >&2; exit 1; }
          source_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          jq -e --arg sha "$tag_commit" --arg path '.github/workflows/release.yml' '
            .head_sha == $sha and .path == $path and (.event == "push" or .event == "workflow_dispatch")
          ' <<<"$source_run" >/dev/null || { echo 'Source workflow identity mismatch.' >&2; exit 1; }
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100")"
          for name in \
            'Build windows-latest' \
            'Build macos-latest' \
            'Build ubuntu-latest' \
            'Validate iPhone and iPad simulators'; do
            jq -e --arg name "$name" '[.jobs[] | select(.name == $name and .conclusion == "success")] | length == 1' <<<"$jobs" >/dev/null || {
              printf 'Required successful source job mismatch: %s\n' "$name" >&2
              exit 1
            }
          done
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > private-draft.json
          jq -e --arg tag "$RELEASE_TAG" --arg target "$tag_commit" --arg name "Harness Desktop $RELEASE_TAG" --rawfile body release-notes.md '
            .tag_name == $tag and .target_commitish == $target and .draft == true and
            .prerelease == false and .name == $name and .body == $body
          ' private-draft.json >/dev/null || { echo 'Private draft metadata does not exactly match the immutable tag.' >&2; exit 1; }
          expected="$(printf '%s\n' \
            "Harness-Desktop-$version-linux-amd64.deb" \
            "Harness-Desktop-$version-linux-x86_64.AppImage" \
            "Harness-Desktop-$version-mac-arm64.dmg" \
            "Harness-Desktop-$version-mac-arm64.zip" \
            "Harness-Desktop-$version-mac-x64.dmg" \
            "Harness-Desktop-$version-mac-x64.zip" \
            "Harness-Desktop-$version-portable-x64.exe" \
            "Harness-Desktop-$version-win-x64.exe" \
            'SHA256SUMS.txt' | LC_ALL=C sort)"
          actual="$(jq -r '.assets[].name' private-draft.json | LC_ALL=C sort)"
          unexpected="$(comm -23 <(printf '%s\n' "$actual") <(printf '%s\n' "$expected"))"
          test -z "$unexpected" || { printf 'Unexpected private draft assets:\n%s\n' "$unexpected" >&2; exit 1; }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          pattern: desktop-*
          path: release-artifacts
      - name: Collect exact cloud artifacts and upload without replacement
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir release-files
          find release-artifacts -mindepth 2 -maxdepth 2 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' \) -print0 |
            while IFS= read -r -d '' file; do
              target="release-files/$(basename "$file")"
              test ! -e "$target" || { echo "Duplicate release asset name: $target" >&2; exit 1; }
              cp "$file" "$target"
            done
          expected="$(printf '%s\n' \
            "Harness-Desktop-$version-linux-amd64.deb" \
            "Harness-Desktop-$version-linux-x86_64.AppImage" \
            "Harness-Desktop-$version-mac-arm64.dmg" \
            "Harness-Desktop-$version-mac-arm64.zip" \
            "Harness-Desktop-$version-mac-x64.dmg" \
            "Harness-Desktop-$version-mac-x64.zip" \
            "Harness-Desktop-$version-portable-x64.exe" \
            "Harness-Desktop-$version-win-x64.exe" | LC_ALL=C sort)"
          actual="$(find release-files -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")
          (cd release-files && sha256sum * > SHA256SUMS.txt)
          expected_with_checksum="$(printf '%s\n%s\n' 'SHA256SUMS.txt' "$expected" | LC_ALL=C sort -u)"
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          for file in release-files/*; do
            name="$(basename "$file")"
            size="$(stat -c %s "$file")"
            digest="sha256:$(sha256sum "$file" | awk '{print $1}')"
            gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > current-draft.json
            jq -e --arg id "$RELEASE_ID" --arg tag "$RELEASE_TAG" --arg target "$tag_commit" --arg name "Harness Desktop $RELEASE_TAG" --rawfile body release-notes.md '
              (.id | tostring) == $id and .tag_name == $tag and .target_commitish == $target and
              .draft == true and .prerelease == false and .name == $name and .body == $body
            ' current-draft.json >/dev/null || { echo 'Exact private draft identity changed during recovery.' >&2; exit 1; }
            asset="$(jq -c --arg name "$name" '.assets[] | select(.name == $name)' current-draft.json)"
            if test -n "$asset"; then
              jq -e --argjson size "$size" --arg digest "$digest" '.size == $size and .digest == $digest' <<<"$asset" >/dev/null || {
                echo "Existing immutable asset differs from the verified cloud artifact: $name" >&2
                exit 1
              }
              echo "Preserving verified existing asset: $name"
              continue
            fi
            encoded_name="$(jq -rn --arg value "$name" '$value | @uri')"
            # The old `gh release upload "$RELEASE_TAG" "$file"` path resolved a
            # release by tag and could target a competing draft. Upload only to
            # the exact, already-verified release id and never replace an asset.
            if ! curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header 'Content-Type: application/octet-stream' \
              --data-binary "@$file" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$encoded_name" \
              > uploaded-asset.json; then
              gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > raced-draft.json
              raced="$(jq -c --arg name "$name" '.assets[] | select(.name == $name)' raced-draft.json)"
              test -n "$raced" || { cat uploaded-asset.json >&2; exit 1; }
              jq -e --arg tag "$RELEASE_TAG" --arg target "$tag_commit" '
                .tag_name == $tag and .target_commitish == $target and .draft == true and .prerelease == false
              ' raced-draft.json >/dev/null
              jq -e --argjson size "$size" --arg digest "$digest" '.size == $size and .digest == $digest' <<<"$raced" >/dev/null
              echo "A concurrent verified uploader won the immutable asset race: $name"
            else
              jq -e --arg name "$name" --argjson size "$size" '.name == $name and .size == $size' uploaded-asset.json >/dev/null
              gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > uploaded-draft.json
              uploaded="$(jq -c --arg name "$name" '.assets[] | select(.name == $name)' uploaded-draft.json)"
              jq -e --arg tag "$RELEASE_TAG" --arg target "$tag_commit" '
                .tag_name == $tag and .target_commitish == $target and .draft == true and .prerelease == false
              ' uploaded-draft.json >/dev/null
              jq -e --argjson size "$size" --arg digest "$digest" '.size == $size and .digest == $digest' <<<"$uploaded" >/dev/null
            fi
          done
          current="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.assets[].name' | LC_ALL=C sort)"
          diff -u <(printf '%s\n' "$expected_with_checksum") <(printf '%s\n' "$current")
      - name: Snapshot the exact completed private draft
        shell: bash
        run: |
          set -euo pipefail
          projection='{id,tag_name,target_commitish,draft,name,body,prerelease,assets:([.assets[] | {id,name,size,digest}] | sort_by(.name))}'
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq "$projection" > draft-snapshot.json
          version="${RELEASE_TAG#v}"
          expected="$(printf '%s\n' \
            'SHA256SUMS.txt' \
            "Harness-Desktop-$version-linux-amd64.deb" \
            "Harness-Desktop-$version-linux-x86_64.AppImage" \
            "Harness-Desktop-$version-mac-arm64.dmg" \
            "Harness-Desktop-$version-mac-arm64.zip" \
            "Harness-Desktop-$version-mac-x64.dmg" \
            "Harness-Desktop-$version-mac-x64.zip" \
            "Harness-Desktop-$version-portable-x64.exe" \
            "Harness-Desktop-$version-win-x64.exe" | LC_ALL=C sort)"
          actual="$(jq -r '.assets[].name' draft-snapshot.json | LC_ALL=C sort)"
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")
          jq -e --arg tag "$RELEASE_TAG" --arg id "$RELEASE_ID" --arg target "$(git rev-list -n 1 "$RELEASE_TAG")" '
            (.id | tostring) == $id and .tag_name == $tag and .target_commitish == $target and
            .draft == true and .prerelease == false and
            all(.assets[]; (.id | type == "number") and (.name | type == "string") and
              (.size | type == "number") and (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$")))
          ' draft-snapshot.json >/dev/null
          # The Windows job below owns the former `releases/assets/$id` and
          # `sha256sum -c SHA256SUMS.txt` byte-verification responsibilities.
      - name: Bind the signed previous stable Windows installer to an exact public asset
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const { compareVersions, validateAndVerifyManifest } = require('./electron/bridge/component-update-contract.cjs')
          const { validateAndVerifyDesktopReleaseManifest } = require('./electron/bridge/desktop-release-contract.cjs')

          const repository = String(process.env.GITHUB_REPOSITORY || '')
          if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repository)) throw new Error('GitHub repository identity is invalid.')
          const currentVersion = JSON.parse(fs.readFileSync('package.json', 'utf8')).version
          if (!/^\d+\.\d+\.\d+$/.test(currentVersion)) throw new Error('Current product version is not a stable semantic version.')
          const desktopSources = JSON.parse(fs.readFileSync('release-update-sources.json', 'utf8'))
          const componentSources = JSON.parse(fs.readFileSync('component-update-sources.json', 'utf8'))
          const desktopManifest = validateAndVerifyDesktopReleaseManifest(
            JSON.parse(fs.readFileSync('release-manifest.json', 'utf8')),
            desktopSources.trustedKeys
          )
          const stable = validateAndVerifyManifest(
            JSON.parse(fs.readFileSync('component-feeds/stable/win32-x64.json', 'utf8')),
            componentSources.trustedKeys
          )
          if (stable.channel !== 'stable' || !/^\d+\.\d+\.\d+$/.test(stable.releaseVersion)) throw new Error('Windows feed is not a stable release.')
          if (compareVersions(stable.releaseVersion, currentVersion) >= 0) throw new Error('Signed Windows stable version is not older than the recovery product tag.')
          if (!stable.fallback || stable.fallback.version !== stable.releaseVersion) throw new Error('Signed Windows stable feed has no same-version full-installer fallback.')

          const stableTag = `v${stable.releaseVersion}`
          const matches = desktopManifest.filter(release => release.tag_name === stableTag && release.draft === false && release.prerelease === false)
          if (matches.length !== 1) throw new Error('Signed desktop manifest does not contain exactly one matching public stable release.')
          const release = matches[0]
          const expectedReleaseName = `Harness Desktop ${stableTag}`
          const expectedReleaseUrl = `https://github.com/${repository}/releases/tag/${stableTag}`
          if (release.name !== expectedReleaseName || release.html_url !== expectedReleaseUrl) throw new Error('Signed previous stable release identity is not the expected GitHub release.')
          const assetName = `Harness-Desktop-${stable.releaseVersion}-win-x64.exe`
          const assets = release.assets.filter(asset => asset.name === assetName)
          if (assets.length !== 1) throw new Error('Signed desktop manifest does not contain exactly one previous stable Windows installer.')
          const asset = assets[0]
          const expectedAssetUrl = `https://github.com/${repository}/releases/download/${stableTag}/${assetName}`
          if (asset.browser_download_url !== expectedAssetUrl) throw new Error('Signed previous stable installer URL is not the exact GitHub tag asset.')
          if (stable.fallback.size !== asset.size || stable.fallback.sha256 !== asset.sha256 || !stable.fallback.urls.includes(expectedAssetUrl)) {
            throw new Error('Signed Windows stable fallback does not match the signed desktop installer asset.')
          }
          fs.writeFileSync('previous-stable-selection.json', `${JSON.stringify({
            version: stable.releaseVersion,
            tag: stableTag,
            releaseName: expectedReleaseName,
            releaseHtmlUrl: expectedReleaseUrl,
            desktopKeyId: release.keyId,
            componentKeyId: stable.keyId,
            asset: {
              name: assetName,
              size: asset.size,
              sha256: asset.sha256,
              browserDownloadUrl: expectedAssetUrl
            }
          }, null, 2)}\n`)
          NODE

          stable_tag="$(jq -er '.tag' previous-stable-selection.json)"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$stable_tag" > previous-public-release.json
          jq -e --slurpfile release previous-public-release.json '
            . as $expected |
            ($release[0].assets | map(select(.name == $expected.asset.name))) as $assets |
            $release[0].tag_name == $expected.tag and $release[0].draft == false and $release[0].prerelease == false and
            $release[0].name == $expected.releaseName and $release[0].html_url == $expected.releaseHtmlUrl and
            ($assets | length) == 1 and $assets[0].size == $expected.asset.size and
            $assets[0].digest == ("sha256:" + $expected.asset.sha256) and
            $assets[0].browser_download_url == $expected.asset.browserDownloadUrl
          ' previous-stable-selection.json >/dev/null || { echo 'Exact public previous stable release differs from the signed tag manifests.' >&2; exit 1; }
          jq --slurpfile release previous-public-release.json '
            . as $expected |
            ($release[0].assets | map(select(.name == $expected.asset.name)) | .[0]) as $asset |
            . + { releaseId: $release[0].id, asset: (.asset + { id: $asset.id, digest: $asset.digest }) }
          ' previous-stable-selection.json > previous-stable.json
          jq -e '
            (.releaseId | type == "number") and (.asset.id | type == "number") and
            (.asset.digest | type == "string" and test("^sha256:[0-9a-f]{64}$"))
          ' previous-stable.json >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recovered-draft-snapshot
          path: |
            draft-snapshot.json
            previous-stable.json
          if-no-files-found: error
          retention-days: 14

  verify-windows-draft:
    name: Install authenticated recovered Windows draft
    needs: recover
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_ID: ${{ inputs.release_id }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: recovered-draft-snapshot
          path: draft-state
      - name: Authenticated exact-id download, checksum, stable upgrade, self-test, and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $downloadRoot = Join-Path $env:RUNNER_TEMP 'recovered-draft-download'
          $installRoot = Join-Path $env:RUNNER_TEMP 'recovered-draft-install'
          $profileRoot = Join-Path $env:RUNNER_TEMP 'recovered-draft-profile'
          $reportPath = Join-Path $env:RUNNER_TEMP 'recovered-installed-selftest.json'
          $previousReportPath = Join-Path $env:RUNNER_TEMP 'recovered-previous-stable-selftest.json'
          $previousInstallerPath = Join-Path $env:RUNNER_TEMP 'recovered-previous-stable-installer.exe'
          $upgradeLog = Join-Path $env:RUNNER_TEMP 'recovered-upgrade-installer.log'
          $portableProfile = Join-Path $env:RUNNER_TEMP 'recovered-portable-profile'
          $portableReport = Join-Path $env:RUNNER_TEMP 'recovered-portable-selftest.json'
          $trackedProcessIds = @()
          function Get-InstalledAppProcesses {
            param([string] $Executable)
            $expectedPath = [IO.Path]::GetFullPath($Executable)
            return @(Get-Process -Name 'Harness Desktop' -ErrorAction SilentlyContinue | Where-Object {
              try { [String]::Equals([IO.Path]::GetFullPath($_.Path), $expectedPath, [StringComparison]::OrdinalIgnoreCase) } catch { $false }
            })
          }
          function Find-DllHoldingProcess {
            param([string] $Executable, [string] $DllPath)
            $expectedDll = [IO.Path]::GetFullPath($DllPath)
            foreach ($candidate in @(Get-InstalledAppProcesses -Executable $Executable)) {
              try {
                foreach ($module in @($candidate.Modules)) {
                  if ([String]::Equals([IO.Path]::GetFullPath($module.FileName), $expectedDll, [StringComparison]::OrdinalIgnoreCase)) { return $candidate }
                }
              } catch {}
            }
            return $null
          }
          Remove-Item -LiteralPath $downloadRoot, $installRoot, $profileRoot, $reportPath, $previousReportPath, $previousInstallerPath, $upgradeLog, $portableProfile, $portableReport -Recurse -Force -ErrorAction SilentlyContinue
          try {
            $snapshotText = (Get-Content 'draft-state/draft-snapshot.json' -Raw).Trim()
            $snapshot = $snapshotText | ConvertFrom-Json
            if ($snapshot.id.ToString() -ne $env:RELEASE_ID) { throw 'Snapshot release id does not match the exact recovery input.' }
            $currentSnapshotText = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" --jq '{id,tag_name,target_commitish,draft,name,body,prerelease,assets:([.assets[] | {id,name,size,digest}] | sort_by(.name))}'
            if ($LASTEXITCODE -ne 0) { throw 'Authenticated exact-id draft lookup failed.' }
            $currentSnapshotText = ($currentSnapshotText -join "`n").Trim()
            if ($currentSnapshotText -ne $snapshotText) { throw 'Draft metadata changed before the recovered Windows gate.' }
            if (-not $snapshot.draft -or $snapshot.tag_name -ne $env:RELEASE_TAG) { throw 'Snapshot is not the expected private draft.' }
            $expectedAssets = @($snapshot.assets | ForEach-Object name | Sort-Object)
            New-Item -ItemType Directory -Path $downloadRoot | Out-Null
            $headers = @{
              Accept = 'application/octet-stream'
              Authorization = "Bearer $env:GH_TOKEN"
              'X-GitHub-Api-Version' = '2022-11-28'
              'User-Agent' = 'harness-desktop-recovery-gate'
            }
            $version = $env:RELEASE_TAG -replace '^v', ''
            $previous = Get-Content 'draft-state/previous-stable.json' -Raw | ConvertFrom-Json
            if ($previous.version -notmatch '^\d+\.\d+\.\d+$' -or [version]$previous.version -ge [version]$version) { throw 'Bound previous stable version is invalid or not older than the draft.' }
            if ($previous.tag -ne "v$($previous.version)" -or $previous.releaseId -notmatch '^\d+$' -or $previous.asset.id -notmatch '^\d+$') { throw 'Bound previous stable release identity is invalid.' }
            if ($previous.asset.name -ne "Harness-Desktop-$($previous.version)-win-x64.exe" -or $previous.asset.digest -ne "sha256:$($previous.asset.sha256)") { throw 'Bound previous stable installer identity is invalid.' }
            $previousRelease = gh api "repos/$env:GITHUB_REPOSITORY/releases/$($previous.releaseId)" --jq '{id,tag_name,draft,prerelease,name,html_url,assets:([.assets[] | {id,name,size,digest,browser_download_url}] | sort_by(.name))}' | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Authenticated exact-id lookup for the previous public stable release failed.' }
            $previousAssets = @($previousRelease.assets | Where-Object { $_.name -eq $previous.asset.name })
            if ($previousRelease.id.ToString() -ne $previous.releaseId.ToString() -or $previousRelease.tag_name -ne $previous.tag -or $previousRelease.draft -or $previousRelease.prerelease) { throw 'Previous stable release is no longer the exact public release bound by the signed manifests.' }
            if ($previousRelease.name -ne $previous.releaseName -or $previousRelease.html_url -ne $previous.releaseHtmlUrl -or $previousAssets.Count -ne 1) { throw 'Previous stable release metadata changed after signed-manifest binding.' }
            $previousAsset = $previousAssets[0]
            if ($previousAsset.id.ToString() -ne $previous.asset.id.ToString() -or $previousAsset.size -ne [int64]$previous.asset.size -or $previousAsset.digest -ne $previous.asset.digest -or $previousAsset.browser_download_url -ne $previous.asset.browserDownloadUrl) { throw 'Previous stable installer asset changed after signed-manifest binding.' }
            $previousInstaller = $previousInstallerPath
            Invoke-WebRequest -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/$($previous.asset.id)" -Headers $headers -OutFile $previousInstaller
            if ((Get-Item -LiteralPath $previousInstaller).Length -ne [int64]$previous.asset.size) { throw 'Previous stable installer size mismatch.' }
            if ((Get-FileHash -LiteralPath $previousInstaller -Algorithm SHA256).Hash.ToLowerInvariant() -ne $previous.asset.sha256) { throw 'Previous stable installer SHA-256 mismatch.' }
            foreach ($asset in $snapshot.assets) {
              if ($asset.id -notmatch '^\d+$' -or [IO.Path]::GetFileName($asset.name) -ne $asset.name -or $asset.digest -notmatch '^sha256:([0-9a-f]{64})$') { throw "Unsafe or incomplete snapshot asset metadata: $($asset.name)" }
              $expectedDigest = $asset.digest.Substring(7)
              $destination = Join-Path $downloadRoot $asset.name
              Invoke-WebRequest -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/$($asset.id)" -Headers $headers -OutFile $destination
              $downloaded = Get-Item -LiteralPath $destination
              if ($downloaded.Length -ne [int64]$asset.size) { throw "Snapshot size mismatch for $($asset.name)." }
              $snapshotHash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($snapshotHash -ne $expectedDigest) { throw "Snapshot digest mismatch for $($asset.name)." }
            }

            $checksumPath = Join-Path $downloadRoot 'SHA256SUMS.txt'
            if (-not (Test-Path -LiteralPath $checksumPath -PathType Leaf)) { throw 'SHA256SUMS.txt is missing.' }
            $entries = @{}
            foreach ($line in Get-Content -LiteralPath $checksumPath) {
              if ($line -notmatch '^([0-9a-fA-F]{64}) [ *](.+)$') { throw "Malformed SHA256SUMS line: $line" }
              $name = $Matches[2]
              if ([IO.Path]::GetFileName($name) -ne $name -or $entries.ContainsKey($name)) { throw "Unsafe or duplicate checksum entry: $name" }
              $entries[$name] = $Matches[1].ToLowerInvariant()
            }
            if ($entries.Count -eq 0) { throw 'SHA256SUMS.txt contains no assets.' }
            $listedAssets = @($entries.Keys | Sort-Object) + 'SHA256SUMS.txt'
            $downloadedAssets = @(Get-ChildItem -LiteralPath $downloadRoot -File | ForEach-Object Name | Sort-Object)
            if (Compare-Object @($listedAssets | Sort-Object) $downloadedAssets) { throw 'Downloaded files do not exactly match SHA256SUMS.txt.' }
            if (Compare-Object $expectedAssets $downloadedAssets) { throw 'Downloaded files do not exactly match the recovered draft snapshot.' }
            foreach ($entry in $entries.GetEnumerator()) {
              $actualHash = (Get-FileHash -LiteralPath (Join-Path $downloadRoot $entry.Key) -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actualHash -ne $entry.Value) { throw "SHA-256 mismatch for $($entry.Key)." }
            }

            $portable = Join-Path $downloadRoot "Harness-Desktop-$version-portable-x64.exe"
            if (-not (Test-Path -LiteralPath $portable -PathType Leaf)) { throw "Expected portable executable is missing: $portable" }
            $portableSelfTest = Start-Process -FilePath $portable -ArgumentList @('--self-test', "--self-test-output=$portableReport", "--user-data-dir=$portableProfile", "--harness-user-data-dir=$portableProfile") -Wait -PassThru
            if ($portableSelfTest.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $portableReport -PathType Leaf)) { throw 'Downloaded portable --self-test failed or omitted its JSON report.' }
            $portableResult = Get-Content -LiteralPath $portableReport -Raw | ConvertFrom-Json
            $portableResult | ConvertTo-Json -Depth 8
            if (-not $portableResult.ok -or $portableResult.product.version -ne $version) { throw 'Downloaded portable self-test JSON failed or reported the wrong version.' }

            $installer = Join-Path $downloadRoot "Harness-Desktop-$version-win-x64.exe"
            if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw "Expected installer is missing: $installer" }
            New-Item -ItemType Directory -Path $profileRoot | Out-Null
            $markerPath = Join-Path $profileRoot 'stable-upgrade-profile.marker'
            $markerValue = "stable-$($previous.version)-to-$version-$([Guid]::NewGuid().ToString('N'))"
            [IO.File]::WriteAllText($markerPath, $markerValue, [Text.UTF8Encoding]::new($false))

            $previousInstall = Start-Process -FilePath $previousInstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installRoot") -Wait -PassThru
            if ($previousInstall.ExitCode -ne 0) { throw "Previous stable installer exited with code $($previousInstall.ExitCode)." }
            $installedExe = Join-Path $installRoot 'Harness Desktop.exe'
            $installedAsar = Join-Path $installRoot 'resources/app.asar'
            $installedD3d = Join-Path $installRoot 'd3dcompiler_47.dll'
            if (-not (Test-Path -LiteralPath $installedExe -PathType Leaf) -or -not (Test-Path -LiteralPath $installedAsar -PathType Leaf) -or -not (Test-Path -LiteralPath $installedD3d -PathType Leaf)) { throw 'Previous stable installation is missing the executable, app.asar, or d3dcompiler_47.dll.' }
            $previousSelfTest = Start-Process -FilePath $installedExe -ArgumentList @('--self-test', "--self-test-output=$previousReportPath", "--user-data-dir=$profileRoot", "--harness-user-data-dir=$profileRoot") -Wait -PassThru
            if ($previousSelfTest.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $previousReportPath -PathType Leaf)) { throw 'Previous stable installed --self-test failed or omitted its JSON report.' }
            $previousReport = Get-Content -LiteralPath $previousReportPath -Raw | ConvertFrom-Json
            $previousReport | ConvertTo-Json -Depth 8
            if (-not $previousReport.ok -or $previousReport.product.version -ne $previous.version) { throw 'Previous stable installed self-test JSON failed or reported the wrong version.' }
            if ([IO.File]::ReadAllText($markerPath) -cne $markerValue) { throw 'Previous stable self-test did not preserve the upgrade profile marker.' }

            $oldLauncher = Start-Process -FilePath $installedExe -ArgumentList @("--user-data-dir=$profileRoot", "--harness-user-data-dir=$profileRoot") -PassThru
            $lockingProcess = $null
            for ($i = 0; $i -lt 90 -and -not $lockingProcess; $i++) {
              Start-Sleep -Milliseconds 500
              $lockingProcess = Find-DllHoldingProcess -Executable $installedExe -DllPath $installedD3d
            }
            if (-not $lockingProcess) { throw 'Previous stable desktop never loaded its installed d3dcompiler_47.dll.' }
            $trackedProcessIds = @(Get-InstalledAppProcesses -Executable $installedExe | ForEach-Object Id)
            if ($trackedProcessIds.Count -eq 0 -or $trackedProcessIds -notcontains $lockingProcess.Id) { throw 'Could not bind the running previous stable desktop process set.' }

            # v1.0.35 hides its BrowserWindow instead of exiting when Restart
            # Manager asks it to close. The candidate installer must carry the
            # CloseApplications=force contract itself; do not override it here,
            # otherwise this gate could pass while the shipped installer regressed.
            # Never restart the old application after the upgrade.
            # Do not pass /CLOSEAPPLICATIONS: legacy installers translate that
            # old updater flag into an interactive compatibility wizard.
            $upgrade = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NORESTARTAPPLICATIONS', '/LOGCLOSEAPPLICATIONS', "/LOG=$upgradeLog", "/DIR=$installRoot") -Wait -PassThru
            if ($upgrade.ExitCode -ne 0) {
              if (Test-Path -LiteralPath $upgradeLog -PathType Leaf) { Get-Content -LiteralPath $upgradeLog }
              throw "Recovered draft upgrade installer exited with code $($upgrade.ExitCode)."
            }
            for ($i = 0; $i -lt 40 -and @(Get-InstalledAppProcesses -Executable $installedExe).Count -gt 0; $i++) { Start-Sleep -Milliseconds 500 }
            $aliveOldProcesses = @($trackedProcessIds | ForEach-Object { Get-Process -Id $_ -ErrorAction SilentlyContinue })
            if ($aliveOldProcesses.Count -ne 0) { throw 'Recovered draft installer did not close every previous stable desktop process.' }
            Start-Sleep -Seconds 3
            if (@(Get-InstalledAppProcesses -Executable $installedExe).Count -ne 0) { throw 'RestartApplications=no contract failed: the desktop restarted after the silent upgrade.' }
            if (-not (Test-Path -LiteralPath $installedExe -PathType Leaf) -or -not (Test-Path -LiteralPath $installedAsar -PathType Leaf)) { throw 'Upgraded executable or app.asar is missing.' }
            if ([IO.File]::ReadAllText($markerPath) -cne $markerValue) { throw 'Recovered draft upgrade did not preserve the same profile marker.' }
            $selfTest = Start-Process -FilePath $installedExe -ArgumentList @('--self-test', "--self-test-output=$reportPath", "--user-data-dir=$profileRoot", "--harness-user-data-dir=$profileRoot") -Wait -PassThru
            if ($selfTest.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $reportPath -PathType Leaf)) { throw 'Upgraded installed --self-test failed or omitted its JSON report.' }
            $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
            $report | ConvertTo-Json -Depth 8
            if (-not $report.ok -or $report.product.version -ne $version) { throw 'Upgraded installed self-test JSON failed or reported the wrong version.' }
            if ([IO.File]::ReadAllText($markerPath) -cne $markerValue) { throw 'Upgraded self-test did not preserve the same profile marker.' }
            $uninstaller = Get-ChildItem -LiteralPath $installRoot -File -Filter 'unins*.exe' | Select-Object -First 1
            if (-not $uninstaller) { throw 'Upgraded installed uninstaller is missing.' }
            $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "Windows uninstaller exited with code $($uninstall.ExitCode)." }
            for ($i = 0; $i -lt 20 -and (Test-Path -LiteralPath $installRoot); $i++) { Start-Sleep -Milliseconds 500 }
            if (Test-Path -LiteralPath $installRoot) { throw 'Uninstaller left the temporary installation directory behind.' }
          }
          finally {
            foreach ($trackedId in @($trackedProcessIds)) { Stop-Process -Id $trackedId -Force -ErrorAction SilentlyContinue }
            try {
              $cleanupUninstaller = Get-ChildItem -LiteralPath $installRoot -File -Filter 'unins*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($cleanupUninstaller) { Start-Process -FilePath $cleanupUninstaller.FullName -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -ErrorAction SilentlyContinue | Out-Null }
            } catch {}
            Remove-Item -LiteralPath $downloadRoot, $installRoot, $profileRoot, $reportPath, $previousReportPath, $previousInstallerPath, $upgradeLog, $portableProfile, $portableReport -Recurse -Force -ErrorAction SilentlyContinue
          }

  publish:
    name: Publish unchanged recovered draft
    needs: verify-windows-draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_ID: ${{ inputs.release_id }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: recovered-draft-snapshot
          path: draft-state
      - name: Reconfirm exact draft snapshot and publish by immutable release id
        shell: bash
        run: |
          set -euo pipefail
          projection='{id,tag_name,target_commitish,draft,name,body,prerelease,assets:([.assets[] | {id,name,size,digest}] | sort_by(.name))}'
          snapshot_id="$(jq -er '.id' draft-state/draft-snapshot.json)"
          test "$snapshot_id" = "$RELEASE_ID"
          cp draft-state/draft-snapshot.json draft-snapshot.json
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq "$projection" > current-draft.json
          test "$(jq -r '.draft' current-draft.json)" = true
          test "$(jq -r '.tag_name' current-draft.json)" = "$RELEASE_TAG"
          diff -u <(jq -S . draft-snapshot.json) <(jq -S . current-draft.json)
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false --jq "$projection" > published.json
          jq -e --arg tag "$RELEASE_TAG" --arg id "$RELEASE_ID" '
            (.id | tostring) == $id and .tag_name == $tag and .draft == false and .prerelease == false
          ' published.json >/dev/null
          jq '.draft = false' draft-snapshot.json > expected-published.json
          diff -u <(jq -S . expected-published.json) <(jq -S . published.json)
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq "$projection" > current-published.json
          diff -u <(jq -S . expected-published.json) <(jq -S . current-published.json)
