name: Feature request
description: Suggest a focused improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: upstream
    attributes:
      label: DeepSeek Harness compatibility impact
      description: Note whether this touches the Bridge, upstream runtime, UI only, or is unknown.
