<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title><!-- 产品/个人名称 --></title>
<style>
  body { margin:0; font-family:system-ui, "Microsoft YaHei", sans-serif; line-height:1.6; }
  .hero { padding:4rem 1rem; text-align:center; background:linear-gradient(135deg,#0ea5e9,#6366f1); color:#fff; }
  .hero h1 { font-size:2.2rem; margin:.5rem 0; }
  .cta { display:inline-block; margin-top:1rem; padding:.6rem 1.4rem; background:#fff; color:#0ea5e9; border-radius:999px; text-decoration:none; font-weight:600; }
  main { max-width:960px; margin:0 auto; padding:1rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:1rem; margin:2rem 0; }
  .card { border:1px solid #e2e8f0; border-radius:12px; padding:1rem; }
  footer { text-align:center; color:#64748b; padding:2rem 1rem; font-size:.85rem; }
</style>
</head>
<body>
  <section class="hero">
    <h1><!-- 名称 --></h1>
    <p><!-- 一句话价值主张 --></p>
    <a class="cta" href="#contact">立即了解</a>
  </section>
  <main>
    <section class="grid">
      <div class="card"><h3>特性一</h3><p><!-- 说明 --></p></div>
      <div class="card"><h3>特性二</h3><p><!-- 说明 --></p></div>
      <div class="card"><h3>特性三</h3><p><!-- 说明 --></p></div>
    </section>
    <section id="contact">
      <h2>联系我们</h2>
      <p>邮箱：<!-- email -->　微信：<!-- wechat --></p>
    </section>
  </main>
  <footer>© <!-- 年份 --> <!-- 名称 --></footer>
</body>
</html>
