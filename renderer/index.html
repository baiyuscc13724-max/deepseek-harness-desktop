<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-src http://127.0.0.1:* http://localhost:*;" />
  <title>Harness Desktop</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="official-shell">
    <div class="window-drag drag-region" aria-hidden="true"></div>
    <button id="skinQuickButton" class="skin-quick-button" type="button" aria-haspopup="dialog" aria-controls="skinPickerOverlay" title="快速切换外观皮肤">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 1.1a6.9 6.9 0 1 0 0 13.8h1.1a1.35 1.35 0 0 0 .55-2.58.72.72 0 0 1 .3-1.38h1.15A3.8 3.8 0 0 0 14.9 7.1 6 6 0 0 0 8 1.1Zm-3.05 7A1.05 1.05 0 1 1 4.95 6a1.05 1.05 0 0 1 0 2.1Zm1.7-3A1.05 1.05 0 1 1 6.65 3a1.05 1.05 0 0 1 0 2.1Zm3.1-.15a1.05 1.05 0 1 1 0-2.1 1.05 1.05 0 0 1 0 2.1Zm2 2.2a1.05 1.05 0 1 1 0-2.1 1.05 1.05 0 0 1 0 2.1Z" fill="currentColor"/></svg>
      <span class="visually-hidden">皮肤</span>
    </button>
    <webview id="runtimeView" partition="persist:harness"></webview>
    <section id="runtimeStatus" class="runtime-status" aria-live="polite">
      <img src="./assets/deepseek-icon.svg" alt="" />
      <strong id="runtimeStatusTitle">正在启动 DeepSeek Harness…</strong>
      <span id="runtimeStatusDetail">官方工作台准备中</span>
      <button id="retryRuntime" class="retry-button hidden">重试</button>
    </section>
    <section id="skinPickerOverlay" class="skin-picker-overlay hidden" aria-hidden="true">
      <div class="skin-picker-dialog" role="dialog" aria-modal="true" aria-labelledby="skinPickerTitle">
        <header class="skin-picker-header">
          <div><h2 id="skinPickerTitle">外观皮肤</h2><p>双击皮肤立即应用，窗口会自动关闭。</p></div>
          <div class="skin-picker-header-actions"><button id="restoreOfficialTheme" type="button">恢复官方外观</button><button id="closeSkinPicker" class="skin-picker-close" type="button" aria-label="关闭">×</button></div>
        </header>
        <div id="skinPickerGrid" class="skin-picker-grid"></div>
        <section class="skin-custom-editor">
          <div><h3>自定义主题</h3><p>背景图只保存在本机，不会上传。</p></div>
          <label>明暗<select id="skinCustomMode"><option value="dark">深色</option><option value="light">浅色</option></select></label>
          <label>强调色<input id="skinCustomAccent" type="color" value="#6f8cff" /></label>
          <label>表面色<input id="skinCustomSurface" type="color" value="#171b29" /></label>
          <label>文字色<input id="skinCustomText" type="color" value="#f4f7ff" /></label>
          <button id="skinChooseBackground" type="button">选择背景图</button>
          <button id="skinApplyCustom" type="button">应用自定义主题</button>
          <span id="skinBackgroundState"></span>
        </section>
      </div>
    </section>
  </main>
  <script src="./theme-catalog.js"></script>
  <script src="./theme-integration.js"></script>
  <script src="./model-routing-integration.js"></script>
  <script src="./app.js"></script>
</body>
</html>
